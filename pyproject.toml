[build-system]
requires = ["setuptools>=80", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "bev-calibration-lab"
version = "0.1.0"
description = "Calibration fault sensitivity and recovery for LiDAR-camera BEV perception"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kuo Tun-Yu" }]
keywords = [
    "autonomous-driving",
    "calibration",
    "lidar-camera",
    "nuscenes",
    "sensor-fusion",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "nuscenes-devkit>=1.2,<1.3",
    "numpy>=1.26,<3",
    "pillow>=10,<13",
    "pydantic>=2.11,<3",
    "pyyaml>=6.0,<7",
    "scipy>=1.14,<2",
    "typer>=0.16,<1",
]

[project.optional-dependencies]
train = [
    "timm>=1.0,<2",
    "torch>=2.4,<3",
    "torchvision>=0.19,<1",
    "tqdm>=4.66,<5",
]
report = [
    "jinja2>=3.1,<4",
    "matplotlib>=3.9,<4",
    "plotly>=6,<7",
]

[dependency-groups]
dev = [
    "build>=1.2,<2",
    "hypothesis>=6.130,<7",
    "mypy>=1.15,<2",
    "mutmut>=3.3,<4",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "types-pyyaml>=6.0,<7",
]
report = [
    "jinja2>=3.1,<4",
    "matplotlib>=3.9,<4",
    "plotly>=6,<7",
]

[project.scripts]
bev-calib = "bevcalib.cli.app:app"

[project.urls]
Homepage = "https://github.com/kuotunyu/bev-calibration-lab"
Issues = "https://github.com/kuotunyu/bev-calibration-lab/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bevcalib = ["report/templates/*.j2"]

[tool.uv]
required-version = ">=0.11.18,<0.12"
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# importlib mode imports each test module by its full path, so two files may share
# a basename. The plan fixes both `tests/unit/geometry/test_frames.py` and
# `tests/unit/nuscenes_adapter/test_frames.py`, and the default prepend mode cannot
# tell them apart.
addopts = ["--strict-markers", "-ra", "--import-mode=importlib"]
markers = [
    "slow: needs real data, a trained model, or another explicitly gated resource",
]
filterwarnings = ["error::RuntimeWarning"]

[tool.coverage.run]
branch = true
source = ["bevcalib"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "RUF", "SIM", "UP", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
# The plan fixes both `tests/unit/geometry/test_frames.py` and
# `tests/unit/nuscenes_adapter/test_frames.py`, so module names must come from the
# directory rather than the basename. Namespace packages give that without
# sprinkling __init__.py through the test tree, which would change how pytest
# resolves conftest files.
namespace_packages = true
explicit_package_bases = true
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_configs = true

[tool.mutmut]
# Release-gate mutation testing of the pure core only (plan task P2-18):
# geometry, perturbations, operators, correctors and metrics. The nuScenes
# adapter, the CLI, the training glue and the artifact writers are held to the
# same 100% branch gate but are not scored here, because their behaviour is
# defined by the devkit and by file formats rather than by arithmetic this
# repository owns.
source_paths = ["src"]
only_mutate = [
    "src/bevcalib/geometry/*",
    "src/bevcalib/perturbations/*",
    "src/bevcalib/operators/*",
    "src/bevcalib/correctors/*",
    "src/bevcalib/metrics/*",
]
also_copy = ["configs", "schemas", "docs"]
# One test file is excluded because it READS first-party source rather than
# running it: the envelope conformance check scans `src/` for any mention of
# P1's package, and mutmut rewrites `src/` to create mutants, so inside the
# sandbox that test describes the sandbox rather than the project. It exercises
# no mutable code path, so excluding it costs no killing power.
pytest_add_cli_args = [
    "-p", "no:cacheprovider", "-x", "-q",
    "--ignore=tests/contract/test_p1_envelope_conformance.py",
]
pytest_add_cli_args_test_selection = ["tests/unit", "tests/integration", "tests/contract"]
